[project]
name = "hcr-c2-015"
version = "0.1.0"
description = "Medical Equipment Maintenance Knowledge Base Q&A Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm — a vendored stub on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# test job in the CI pipeline). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# agenticstar-agentcore ships no py.typed marker (PEP 561) for framework/shared,
# so every import from them is "installed, but missing library stubs" under
# strict mode, which then cascades into disallow_subclassing_any failures for
# every node/graph class in this repo (they all inherit from an Any-typed SDK
# base class). Both are structural gaps in the installed wheel, not real type
# errors in this template's own code.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.*"
disallow_subclassing_any = false
