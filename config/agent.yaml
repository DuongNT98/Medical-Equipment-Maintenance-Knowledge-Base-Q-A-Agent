# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors); see the
# framework's AgentRegistry manifest schema documentation for the full contract.
id: "HCR-C2-015"
name: "Medical Equipment Maintenance Knowledge Base Q&A Agent"
namespace: "hcr"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. QueryNormalizeNode / ProcedureExtractNode resolve
# an Azure OpenAI client per-invocation from requires.secrets below when bound;
# with no secrets bound they run their deterministic heuristic instead (see
# docs/07_operation_guide.md). Once an LLM IS configured, a failed call is a
# hard error, never a silent fallback to the heuristic (finding-recipes.md 3m).
generation_mode: "llm"
industry: "HCR"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "RAGAgent"  # VectorRAG pattern reference; code inherits AgentBaseGraph (L1) directly

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.HCRC2015Graph"

# Security — professional-access scope (biomedical engineers), no PHI.
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# All three secrets are resolved via ctx.secrets.require(...) inside
# QueryNormalizeNode/ProcedureExtractNode.execute() (never cached on self) — a
# missing secret means "no LLM configured" and falls back to the deterministic
# heuristic; it does not fail compile (require_at_compile() is not used here).
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI

# generation_mode is deployment identity, not a tunable provider setting. Runtime parameters
# (max_retry, timeout_s, hitl, memory_enabled, ...) live in
# config/config.yaml — AgentRegistry loads that file separately and passes it
# as Graph(config=...). Do NOT put them here.
